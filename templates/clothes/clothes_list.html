{% include "header.html" %}

<h1>Одежда в категории: {{ category.name }}</h1>

<a href="{% url 'clothes_list' %}">Назад к категориям</a>

<ul>
    {% for item in clothes %}
        <li>{{ item.name }} — {{ item.price }} сом</li>
    {% empty %}
        <li>В этой категории пока нет товаров.</li>
    {% endfor %}
</ul>
