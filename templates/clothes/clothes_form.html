{% include "header.html" %}

<h1>{% if clothes %}Редактировать{% else %}Добавить{% endif %} одежду</h1>

<form method="post">
    {% csrf_token %}
    <label>Название:</label>
    <input type="text" name="name" value="{{ clothes.name|default:'' }}"><br>

    <label>Цена:</label>
    <input type="number" step="0.01" name="price" value="{{ clothes.price|default:'' }}"><br>

    <label>Категория:</label>
    <select name="category">
        {% for cat in categories %}
            <option value="{{ cat.id }}" {% if clothes and clothes.category.id == cat.id %}selected{% endif %}>
                {{ cat.name }}
            </option>
        {% endfor %}
    </select><br>

    <button type="submit">Сохранить</button>
</form>

<a href="{% url 'categories_list' %}">Назад</a>

{% include "footer.html" %}
