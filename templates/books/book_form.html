<h1>{% if book %}Редактировать книгу{% else %}Создать книгу{% endif %}</h1>

<form method="POST">
    {% csrf_token %}
    
    <label>Название:</label>
    <input type="text" name="title" value="{{ book.title|default:'' }}">

    <label>Автор:</label>
    <input type="text" name="author" value="{{ book.author|default:'' }}">

    <label>Описание:</label>
    <textarea name="description">{{ book.description|default:'' }}</textarea>

    <label>Год публикации:</label>
    <input type="number" name="published_year" value="{{ book.published_year|default:'' }}">

    <button type="submit">Сохранить</button>
</form>
