{% load static %}

{% block title %}Список книг{% endblock %}

{% block content %}
<h2>Список книг</h2>
<ul>
  {% for book in books %}
    <li>
      <a href="{% url 'book_detail' book.pk %}">{{ book.title }}</a> — {{ book.author }}
    </li>
  {% empty %}
    <li>Книг пока нет.</li>
  {% endfor %}
</ul>
{% endblock %}
